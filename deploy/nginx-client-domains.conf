# /etc/nginx/sites-available/client-domains
#
# Client companies' own addresses. Each one serves the same NexorCRM app as
# os.nexorcrm.com (Node on port 7003); the app recognises the company from
# the address and shows its logo and name, and the address bar stays on the
# client's domain.
#
# To add a client domain, for example crm.landmint.com:
#   1. DNS at the client's registrar: an "A" record for crm -> this server's IP
#      (the same IP as os.nexorcrm.com).
#   2. Add the domain to server_name below, then:
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d crm.landmint.com
#   3. In NexorCRM: Platform -> Companies -> the company -> Own domain, enter
#      crm.landmint.com and save.
#
# First install:
#   sudo cp deploy/nginx-client-domains.conf /etc/nginx/sites-available/client-domains
#   sudo ln -s /etc/nginx/sites-available/client-domains /etc/nginx/sites-enabled/
# (the $connection_upgrade map is defined in the os.nexorcrm.com config)

server {
    listen 80;
    # Add each new client domain here, e.g. crm.landmint.com, once its DNS points at this server.
    server_name crm.roofonwalls.com;

    # Team-chat photos arrive as base64 JSON up to ~6MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7003;
        proxy_http_version 1.1;
        # Socket.IO live updates upgrade to a websocket on the same port.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The app reads the company from this.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
