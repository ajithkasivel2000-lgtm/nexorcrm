# /etc/nginx/sites-available/crm.roofonwalls.com
#
# Sends Roofonwalls' own address to their company's sign-in page on the
# NexorCRM platform, which shows the Roofonwalls logo and name.
#
#   crm.roofonwalls.com          -> os.nexorcrm.com/?company=roofonwalls
#   crm.roofonwalls.com/portal   -> os.nexorcrm.com/portal?company=roofonwalls  (buyer portal)
#
# Needs a DNS "A" record: crm.roofonwalls.com -> this server's IP address
# (the same IP as os.nexorcrm.com). Then:
#   sudo ln -s /etc/nginx/sites-available/crm.roofonwalls.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.roofonwalls.com
# Certbot copies these redirects into the https (443) block it adds.
#
# For another client company, copy this file and change the domain and the
# company code (the "slug" shown under Platform -> Companies).

server {
    listen 80;
    server_name crm.roofonwalls.com;

    location /portal {
        return 302 https://os.nexorcrm.com/portal?company=roofonwalls;
    }

    location / {
        return 302 https://os.nexorcrm.com/?company=roofonwalls;
    }
}
