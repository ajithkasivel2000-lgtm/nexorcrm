# /etc/nginx/sites-available/crm.landmint.com
#
# Sends Landmint's own address to their company's sign-in page on the
# NexorCRM platform, which shows the Landmint logo and name.
#
#   crm.landmint.com          -> os.nexorcrm.com/?company=landmint
#   crm.landmint.com/portal   -> os.nexorcrm.com/portal?company=landmint  (buyer portal)
#
# Needs a DNS "A" record: crm.landmint.com -> this server's IP address
# (the same IP as os.nexorcrm.com). Then:
#   sudo ln -s /etc/nginx/sites-available/crm.landmint.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.landmint.com
# Certbot copies these redirects into the https (443) block it adds.
#
# For another client company, copy this file and change the domain and the
# company code (the "slug" shown under Platform -> Companies).

server {
    listen 80;
    server_name crm.landmint.com;

    location /portal {
        return 302 https://os.nexorcrm.com/portal?company=landmint;
    }

    location / {
        return 302 https://os.nexorcrm.com/?company=landmint;
    }
}
