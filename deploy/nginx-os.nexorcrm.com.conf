# /etc/nginx/sites-available/os.nexorcrm.com
# Node (port 7003) serves the UI and the API; nginx only terminates TLS.
# After enabling: sudo certbot --nginx -d os.nexorcrm.com
# Websocket upgrade for Socket.IO (live updates).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name os.nexorcrm.com;

    # Team-chat photos arrive as base64 JSON up to ~6MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7003;
        proxy_http_version 1.1;
        # Socket.IO live updates upgrade to a websocket on the same port.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
