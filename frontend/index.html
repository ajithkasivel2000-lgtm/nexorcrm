<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Viewport -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Primary SEO -->
  <title>NexorCRM | Smart CRM & Business Management Platform</title>

  <meta
    name="description"
    content="NexorCRM is a powerful CRM and business management platform for managing leads, customers, opportunities, campaigns, projects, sales and business performance."
  />

  <meta
    name="keywords"
    content="NexorCRM, CRM software, CRM system, customer relationship management, lead management, customer management, sales CRM, opportunity management, campaign management, project management, business management software, sales management, CRM dashboard"
  />

  <meta name="author" content="NexorCRM" />

  <!-- Search Engine -->
  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <!-- Theme -->
  <meta name="theme-color" content="#111827" />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="NexorCRM | Smart CRM & Business Management Platform"
  />

  <meta
    property="og:description"
    content="Manage leads, customers, opportunities, campaigns, projects and sales with NexorCRM."
  />

  <meta
    property="og:image"
    content="/logo_dark.png"
  />

  <meta
    property="og:image:alt"
    content="NexorCRM CRM Dashboard"
  />

  <meta
    property="og:site_name"
    content="NexorCRM"
  />

  <meta
    property="og:locale"
    content="en_US"
  />

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="NexorCRM | Smart CRM & Business Management Platform"
  />

  <meta
    name="twitter:description"
    content="A complete CRM platform for leads, customers, sales, opportunities, campaigns and projects."
  />

  <meta
    name="twitter:image"
    content="/logo_dark.png"
  />

  <!-- Canonical: set this to the deployment domain before going live. A
       placeholder here points crawlers at a site that is not yours, so it
       stays off until there is a real value. -->
  <!-- <link rel="canonical" href="https://example.com/" /> -->

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx">
  </script>

</body>

</html>
